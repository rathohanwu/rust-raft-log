name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run standard test suite
        run: cargo test-all
      - name: Run real gRPC E2E tests
        run: |
          cargo test --test e2e_single -- --ignored
          cargo test --test e2e_cluster -- --ignored
          cargo test --test e2e_failover -- --ignored
          cargo test --test e2e_recovery -- --ignored
          cargo test --test e2e_two_node -- --ignored
